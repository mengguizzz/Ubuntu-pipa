name: Build Ubuntu pipa images

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
      - "nightly-*"
      # build-* tags are created by publish-tag after a successful main/dispatch
      # build; do not list them here or the tag push would rebuild again.

permissions:
  contents: write

jobs:
  image:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        variant: [gnome]
    steps:
      - uses: actions/checkout@v4

      - name: Build builder image
        run: docker build -t ubuntu-pipa-builder .

      - name: Build ${{ matrix.variant }} image
        run: |
          mkdir -p output
          docker run --rm --privileged \
            -v "$PWD/output:/build/output" \
            -v /dev:/dev \
            -e BUILD_VARIANTS="${{ matrix.variant }}" \
            -e BUILD_GIT_REV="${{ github.sha }}" \
            -e PIPA_PKGS_URL="https://mengguizzz.github.io/pipa-pkgs/ubuntu/" \
            ubuntu-pipa-builder

      - name: Upload ${{ matrix.variant }} archive
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-pipa-${{ matrix.variant }}
          path: |
            output/ubuntu-pipa-${{ matrix.variant }}-*.tar.xz
            output/ubuntu-pipa-${{ matrix.variant }}-*.tar.xz.sha256
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Split oversized archives and stage release assets
        id: stage
        run: |
          set -euo pipefail
          mkdir -p staged
          find release-assets -type f \( -name '*.tar.xz' -o -name '*.sha256' \) \
            -exec cp -a {} staged/ \;
          cd staged
          MAX_BYTES=$((1900 * 1024 * 1024))
          shopt -s nullglob
          for archive in *.tar.xz; do
            size=$(stat -c%s "$archive")
            echo "$archive: $size bytes"
            if [ "$size" -gt "$MAX_BYTES" ]; then
              echo "Splitting $archive into <=1900MiB parts"
              split -b "$MAX_BYTES" -d -a 2 --additional-suffix=.part \
                "$archive" "${archive}."
              rm -f "$archive"
            fi
          done
      
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Nightly Build {0}', github.run_number) }}
          files: release-assets/*
          prerelease: ${{ github.ref_type != 'tag' }} 
          body: |
            已修复 Snap (LZO/ZSTD) 挂载问题；
            ⚠️ **解压说明：体积过大的文件（>=2GB），已被切割，小文件不需要。**
            请下载所有的 `.part*` 文件，放进同一个文件夹，然后执行以下命令合并：
            ```bash
            cat ubuntu-pipa-xxxx-*.tar.xz.part* > ubuntu-pipa-gnome.tar.xz
            ```
            合并后，建议使用附带的 sha256 校验文件验证完整性：
            ```bash
            sha256sum -c ubuntu-pipa-gnome-*.tar.xz.sha256
            ```
